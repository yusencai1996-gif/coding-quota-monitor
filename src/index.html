<!doctype html><html lang="zh-CN" data-theme="day"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'"><title>额度 · 专注</title><link rel="stylesheet" href="style.css"><script src="renderer.js" defer></script></head><body><main id="app"><p>正在连接本机监控服务…</p></main><dialog id="settings"><form id="settings-form"><header class="dialog-head"><h2>设置</h2><button type="button" id="close-settings" aria-label="关闭设置">×</button></header><p class="note">Key 仅在本机加密保存，已保存内容不会回显。</p><fieldset><legend>数据位置</legend><p id="data-location" class="note source-path"></p><div class="actions"><button type="button" id="pick-data">选择下次使用的数据目录</button></div><p id="data-message" class="note" role="status">更新时只替换 app 文件夹，保留 data 和数据位置配置。</p></fieldset><div id="source-fields"></div><div class="actions"><button type="button" id="save-sources">保存来源与读取授权</button></div><p id="sources-message" class="note" role="status"></p><div id="key-fields"></div><fieldset><legend>显示与刷新</legend><label>自动刷新间隔（分钟）<input id="interval" type="number" min="1" max="120" required></label><label><input id="pinned" type="checkbox">固定窗口，失焦不收起</label><label><input id="detailed-tokens" type="checkbox">显示详细 Token 数字</label><label><input id="notifications" type="checkbox">允许所有通知（低额度、重置卡到期）</label><button type="button" id="test-notification">测试通知</button><p id="notification-message" class="note" role="status">先保存通知开关，再测试系统通知。</p><label><input id="autostart" type="checkbox">开机自启（仅发布版）</label></fieldset><p id="settings-message" role="status"></p><div class="actions"><button type="submit">保存设置</button><button type="button" id="cancel-settings">关闭</button></div></form></dialog><div id="toast" role="status" hidden></div></body></html>
